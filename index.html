<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>EmulatorJS</title>
        <link rel="icon" href="docs/favicon.ico" sizes="16x16 32x32 48x48 64x64" type="image/vnd.microsoft.icon">
        <meta name="viewport" content="width = device-width, initial-scale = 1">
        <style>
             body, html {
                height: 100%;
                background-color: black;
                color: white;
            }

            body {
                margin: 0;
                overflow: hidden;
            }

            body, #box, #top {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
            }

            #box {
                color: #aaa;
                height: 20em;
                width: 30em;
                max-width: 80%;
                max-height: 80%;
                background-color: #333;
                border-radius: 0.4em;
                border: 2px solid #555;
                position: relative;
                flex-direction: column;
                transition-duration: 0.2s;
                overflow: hidden;
                font-family: monospace;
                font-weight: bold;
                font-size: 20px;
                margin: 5px;
                text-align: center;
                padding: 10px;
            }

            #box:hover, #box[drag] {
                border-color: #1AAFFF;
                color: #ddd
            }

            #advanced {
                color: #aaa;
                text-align: left;
                width: 30em;
                max-width: 80%;
                background-color: #333;
                border-radius: 0.4em;
                border: 2px solid #555;
                position: relative;
                flex-direction: column;
                transition-duration: 0.2s;
                overflow: hidden;
                font-family: monospace;
                font-weight: bold;
                font-size: 20px;
                margin: 5px;
                padding: 10px;
            }

            #advancedOptionsBox {
                margin-top: 10px;
                font-size: 14px;
                margin-left: 20px;
            }

            .advancedOptionsBoxRow {
                margin-top: 10px;
            }

            #input {
                cursor: pointer;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                opacity: 0;
            }

            #display {
                width: 100%;
                height: 100%
            }

            select, button {
                padding: 0.6em 0.4em;
                margin: 0.5em;
                width: 15em;
                max-width: 100%;
                font-family: monospace;
                font-weight: bold;
                font-size: 16px;
                background-color: #444;
                color: #aaa;
                border-radius: 0.4em;
                border: 1px solid #555;
                cursor: pointer;
                transition-duration: 0.2s
            }

            select:hover, button:hover {
                background-color: #666;
                color: #ddd
            }

            .logo {
                width: 130px;
                height: 130px;
                filter: drop-shadow(0 0 8px white);
            }

            #top {
                margin: 5px;
            }
        </style>
    </head>

    <body>
        <div id="top">
            <h1>EmulatorJS Demo</h1>
            <img src="docs/Logo-light.png" alt="Logo" class="logo">
            <br>
        </div>
        <div id="box">
            <input type="file" id ="input" title="Upload" />
            Drag ROM file or click here
        </div>
        <div id="advanced">
            <div id="advancedToggleBox">
                <input type="checkbox" id="advancedToggle" />
                <label for="advancedToggle"> Show Advanced Options</label>
            </div>
            <div id="advancedOptionsBox">
                <div class="advancedOptionsBoxRow">
                    <input type="file" id ="inputAdvanced" title="BIOS" />
                    <label for="inputAdvanced"> Upload BIOS file (if required)</label>
                </div>
                <div class="advancedOptionsBoxRow">
                    <input type="text" id="mameDriverInput" placeholder="e.g. electron64" />
                    <label for="mameDriverInput"> MAME model (MAME-based systems, optional)</label>
                </div>
                <div class="advancedOptionsBoxRow">
                    <input type="checkbox" id="debugToggle" />
                    <label for="debugToggle"> Enable Debug Mode</label>
                </div>
                <div id="advancedOptionsBoxThreads" class="advancedOptionsBoxRow">
                    <input type="checkbox" id="threadsToggle" />
                    <label for="threadsToggle"> Enable Threads</label>
                </div>
                <div id="advancedOptionsCache" class="advancedOptionsBoxRow">
                    <input type="checkbox" id="cacheToggle" checked="checked" />
                    <label for="cacheToggle"> Enable Cache</label>
                </div>
                <div class="advancedOptionsBoxRow">
                    <button id="clearCacheButton">Clear Cache</button>
                    <span id="clearCacheStatus"></span>
                </div>
                <div class="advancedOptionsBoxRow">
                    <span>Browser mode: </span>
                    <input type="radio" id="browserModeAuto" name="browserMode" value="auto">
                    <label for="browserModeAuto"> Auto </label>
                    <input type="radio" id="browserModeDesktop" name="browserMode" value="desktop">
                    <label for="browserModeDesktop"> Desktop </label>
                    <input type="radio" id="browserModeMobile" name="browserMode" value="mobile">
                    <label for="browserModeMobile"> Mobile </label>
                </div>
            </div>
        </div>

        <script>
            let enableDebug = false;
            let enableThreads = false;
            let browserMode;

            const biosFileInput = document.getElementById("inputAdvanced");
            
            const advancedToggle = document.getElementById("advancedToggle");
            const advanced = document.getElementById("advanced");
            const advancedOptionsBox = document.getElementById("advancedOptionsBox");
            advancedOptionsBox.style.display = "none";
            advancedToggle.addEventListener("change", (event) => {
                if (event.target.checked) {
                    advancedOptionsBox.style.display = "block";
                } else {
                    advancedOptionsBox.style.display = "none";
                }
            });

            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const debugToggle = document.getElementById("debugToggle");
            debugToggle.addEventListener("change", (event) => {
                enableDebug = event.target.checked;
                console.log(`Debug is ${enableDebug ? "enabled" : "disabled"}`);
            });
            const cacheToggle = document.getElementById("cacheToggle");
            window.EJS_cacheConfig = {
                enabled: true,
                cacheMaxSizeMB: 4096, // 4096 MB = 4 GB
                cacheMaxAgeMins: 7200 // 7200 minutes = 5 days
            };
            cacheToggle.addEventListener("change", (event) => {
                const cacheEnabled = event.target.checked;
                console.log(`Cache is ${cacheEnabled ? "enabled" : "disabled"}`);
                window.EJS_cacheConfig.enabled = cacheEnabled;
            });
            // removes downloaded cores/roms only; save states live in a separate database
            const clearCacheButton = document.getElementById("clearCacheButton");
            const clearCacheStatus = document.getElementById("clearCacheStatus");
            clearCacheButton.addEventListener("click", () => {
                const request = indexedDB.deleteDatabase("EmulatorJS-Cache");
                request.onsuccess = () => {
                    clearCacheStatus.textContent = " Cache cleared";
                    console.log("Cache cleared");
                };
                request.onerror = () => {
                    clearCacheStatus.textContent = " Failed to clear cache";
                    console.error("Failed to clear cache", request.error);
                };
                request.onblocked = () => {
                    clearCacheStatus.textContent = " Cache is in use, close other EmulatorJS tabs and try again";
                };
            });
            const threadsToggleAvailable = document.getElementById("advancedOptionsBoxThreads");
            const threadsToggle = document.getElementById("threadsToggle");
            threadsToggle.addEventListener("change", (event) => {
                enableThreads = event.target.checked;
                console.log(`Threads are ${enableThreads ? "enabled" : "disabled"}`);
            });
            if (parseInt(urlParams.get("debug")) === 1 || urlParams.get("debug") === "true") {
                enableDebug = true;
                debugToggle.checked = true;
                console.log("Debug is enabled");
            } else {
                debugToggle.checked = false;
                console.log("Debug is disabled");
            }

            if (window.SharedArrayBuffer) {
                threadsToggleAvailable.style.display = "block";
                if (parseInt(urlParams.get("threads")) === 1 || urlParams.get("threads") === "true") {
                    enableThreads = true;
                    threadsToggle.checked = true;
                    console.log("Threads are enabled");
                } else {
                    threadsToggle.checked = false;
                    console.log("Threads are disabled");
                }
            } else {
                threadsToggleAvailable.style.display = "none";
                console.warn("Threads are disabled as SharedArrayBuffer is not available. Threads requires two headers to be set when sending you html page. See https://stackoverflow.com/a/68630724");
            }

            const browserModeAuto = document.getElementById("browserModeAuto");
            browserModeAuto.addEventListener("change", (event) => {
                if (event.target.checked) {
                    browserMode = undefined;
                    console.log("Browser mode set to auto");
                }
            });
            const browserModeDesktop = document.getElementById("browserModeDesktop");
            browserModeDesktop.addEventListener("change", (event) => {
                if (event.target.checked) {
                    browserMode = "desktop";
                    console.log("Browser mode set to desktop");
                }
            });
            const browserModeMobile = document.getElementById("browserModeMobile");
            browserModeMobile.addEventListener("change", (event) => {
                if (event.target.checked) {
                    browserMode = "mobile";
                    console.log("Browser mode set to mobile");
                }
            });
            if (urlParams.get("browserMode")) {
                browserMode = urlParams.get("browserMode");
                switch (browserMode) {
                    case 1:
                    case "1":
                    case "mobile":
                        browserModeMobile.checked = true;
                        break;
                    case 2:
                    case "2":
                    case "desktop":
                        browserModeDesktop.checked = true;
                        break;
                    default:
                        browserModeAuto.checked = true;
                        break;
                }
            } else {
                browserModeAuto.checked = true;
            }

            if (urlParams.get("rom")) {
                console.log(`Loading ROM from URL: roms/${urlParams.get("rom")}`);
                run(false, urlParams.get("rom"));
            }

            async function run(upload, file) {
                const url = upload ? input.files[0] : `roms/${file}`;
                const parts = upload ? input.files[0].name.split(".") : file.split(".");

                const biosUrl = biosFileInput.files.length > 0 ? biosFileInput.files[0] : "";
                const mameDriver = document.getElementById("mameDriverInput").value.trim();

                const core = await (async (ext) => {
                    if (["nes", "fds", "unf", "unif", "nsf"].includes(ext))
                        return "nes"

                    if (["smc", "sfc", "swc", "fig", "bs"].includes(ext))
                        return "snes"

                    if (["gb", "gbc"].includes(ext))
                        return "gb"

                    if (["a26"].includes(ext))
                        return "atari2600"

                    if (["20", "40", "60", "a0", "b0"].includes(ext))
                        return "vic20"

                    if (["moof", "dc42", "hda", "sit"].includes(ext))
                        return "mac"

                    if (["cdt", "cpr"].includes(ext))
                        return "cpc"

                    if (["adf", "adz", "dms", "hdz"].includes(ext))
                        return "amiga"

                    if (["tzx", "z80", "rzx", "scl", "trd", "dck", "sna", "szx"].includes(ext))
                        return "zxspectrum"

                    if (["2d"].includes(ext) && enableThreads)
                        return "x1"

                    if (["uef", "ssd", "dsd", "adl"].includes(ext) && enableThreads)
                        return "electron"

                    if (["sg", "sc"].includes(ext) && enableThreads)
                        return "sg1000"

                    if (["sms"].includes(ext))
                        return "segaMS"

                    if (["gg"].includes(ext))
                        return "segaGG"

                    if (["md", "smd", "gen", "mdx"].includes(ext))
                        return "segaMD"

                    if (["pce"].includes(ext))
                        return "pce"

                    if (["a52"].includes(ext))
                        return "atari5200"

                    if (["a78"].includes(ext))
                        return "atari7800"

                    if (["lnx"].includes(ext))
                        return "lynx"

                    if (["xfd", "atr", "atx", "dcm", "xex"].includes(ext))
                        return "atari800"

                    if (["d98", "98d", "fdi", "hdi", "nhd", "thd"].includes(ext))
                        return "pc98"

                    if (["st", "msa", "stx"].includes(ext))
                        return "atarist"

                    if (["hdf"].includes(ext))
                        return "x68000"

                    if (["mx1", "mx2", "ri"].includes(ext))
                        return "msx"

                    if (["u88"].includes(ext))
                        return "pc88"

                    if (["do", "po", "woz", "2mg", "2img", "hdv", "apl", "iie"].includes(ext))
                        return "apple2"

                    return await new Promise(resolve => {
                        var coreValues = {
                            "Arcade (MAME 2003-Plus)": "mame",
                            "Neo Geo": "neogeo",
                            "NES / Famicom": "nes",
                            "SNES / Super Famicom": "snes",
                            "Game Boy / Game Boy Color": "gb",
                            "Atari 2600": "atari2600",
                            "Atari 5200": "atari5200",
                            "Atari 7800": "atari7800",
                            "Atari Lynx": "lynx",
                            "Commodore VIC-20": "vic20",
                            "Commodore 64": "c64",
                            "Commodore 128": "c128",
                            "Commodore 16 / Plus/4": "plus4",
                            "Commodore Amiga": "amiga",
                            "Amstrad CPC": "cpc",
                            "Apple Macintosh": "mac",
                            "ZX Spectrum": "zxspectrum",
                            "Sega Master System": "segaMS",
                            "Sega Game Gear": "segaGG",
                            "Sega Mega Drive / Genesis": "segaMD",
                            "Sega CD / Mega-CD": "segaCD",
                            "PC Engine / TurboGrafx-16": "pce",
                            "Atari 8-bit (400/800/XL/XE)": "atari800",
                            "Atari ST/STE/TT/Falcon": "atarist",
                            "NEC PC-8801": "pc88",
                            "NEC PC-9801": "pc98",
                            "Fujitsu FM Towns": "fmtowns",
                            "MSX": "msx",
                            "Sharp X68000": "x68000"
                        }

                        if (enableThreads) {
                            coreValues["Apple II"] = "apple2";
                            coreValues["DOS"] = "dos";
                            coreValues["Sharp X1"] = "x1";
                            coreValues["Acorn Electron"] = "electron";
                            coreValues["Sega SG-1000"] = "sg1000";
                            coreValues["Sega Saturn"] = "segaSaturn";
                        }

                        for (let core in coreValues) {
                            if (core.toLowerCase() === ext) {
                                resolve(core)
                            }
                        }
 
                        const cores = Object.keys(coreValues).sort().reduce(
                            (obj, key) => { 
                                obj[key] = coreValues[key]; 
                                return obj;
                            }, 
                            {}
                        );

                        const button = document.createElement("button")
                        const select = document.createElement("select")

                        for (const type in cores) {
                            const option = document.createElement("option")

                            option.value = cores[type]
                            option.textContent = type
                            select.appendChild(option)
                        }

                        button.onclick = () => resolve(select[select.selectedIndex].value)
                        button.textContent = "Load game"
                        box.innerHTML = ""

                        box.appendChild(select)
                        box.appendChild(button)
                    })
                })(parts.pop())

                const div = document.createElement("div")
                const sub = document.createElement("div")
                const script = document.createElement("script")

                sub.id = "game"
                div.id = "display"

                const top = document.getElementById("top");
                top.remove();
                box.remove();
                div.appendChild(sub);
                advanced.remove();
                document.body.appendChild(div)

                window.EJS_player = "#game";
                window.EJS_gameName = parts.shift();
                window.EJS_biosUrl = biosUrl;
                window.EJS_gameUrl = url;
                window.EJS_core = core;
                window.EJS_pathtodata = "data/";
                window.EJS_startOnLoaded = true;
                window.EJS_DEBUG_XX = enableDebug;
                window.EJS_threads = enableThreads;
                if (mameDriver) {
                    window.EJS_mameDriver = mameDriver;
                }
                if (browserMode) {
                    window.EJS_browserMode = browserMode;
                }
                window.EJS_askBeforeExit = false;
                window.EJS_onExit = () => {
                        alert("The emulator has exited. This callback can be used to do any cleanup or show a message to the user.");
                    };

                script.src = "data/loader.js";
                document.body.appendChild(script);
            }
            
            input.onchange = async () => {
                run(true);
            }
            
            box.ondragover = () => box.setAttribute("drag", true);
            box.ondragleave = () => box.removeAttribute("drag");
        </script>
    </body>
</html>
